<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таймер зворотного відліку</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

<h2>Таймер зворотного відліку</h2>

<label>Введіть час (секунди):
    <input type="number" id="timeInput" min="1" value="10">
</label>

<br><br>

<div id="timerDisplay">10</div>

<br>

<button id="startBtn">Старт</button>
<button id="pauseBtn">Пауза</button>
<button id="increaseBtn">+10 сек</button>
<button id="decreaseBtn">-10 сек</button>

<p id="message" style="color:green;"></p>

<script src="script3.js"></script>
</body>
</html>
