<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма користувача</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Форма користувача</h1>

<form id="userForm">
    <label>Ім'я:</label>
    <input type="text" id="name" required><br><br>

    <label>Email:</label>
    <input type="email" id="email" required><br><br>

    <label>Телефон:</label>
    <input type="tel" id="phone"><br><br>

    <label>Пароль:</label>
    <input type="password" id="password" required><br><br>

    <button type="button" id="updateBtn">Оновити</button>
    <button type="button" id="clearBtn">Очистити дані</button>
</form>

<script src="ex.js"></script>
</body>
</html>
